name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'false'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env file
        run: |
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          GRADCAM_URL="${{ secrets.GRADCAM_URL }}"

          [ -z "$SUPABASE_URL" ] && SUPABASE_URL="https://jouddihxwhjohzvpgfgd.supabase.co"
          [ -z "$SUPABASE_ANON_KEY" ] && SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpvdWRkaWh4d2hqb2h6dnBfZmdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTcxNTE5MjIsImV4cCI6MjA3MjcyNzkyMn0.jUoA6vXGq3W-h9pB_gXGkUoI7gM8s6U7s2p8e9-s-e4"
          [ -z "$GRADCAM_URL" ] && GRADCAM_URL="https://sih-app-0yq3.onrender.com/generate_gradcam"

          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "GRADCAM_URL=$GRADCAM_URL" >> .env

          echo "--- .env created ---"
          cat .env

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: optixai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
